}
@media (prefers-color-scheme: dark){

    --bg:#0e1a17; --surface:#16262a; --ink:#e7f0ed; --muted:#9db1aa; --line:#2b403a;

    --warn:#f0b35c; --warn-soft:#3a2a10; --bad:#ff8a8d; --good:#6fd3a0; --good-soft:#15392a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a17; --surface:#16262a; --ink:#e7f0ed; --muted:#9db1aa; --line:#2b403a;
  --accent:#4fc0cd; --accent-ink:#06262b; --accent-soft:#17383d;
  --warn:#f0b35c; --warn-soft:#3a2a10; --bad:#ff8a8d; --good:#6fd3a0; --good-soft:#15392a;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}

p{margin:0}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

.lang{display:flex;gap:4px}

.eyebrow{font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

.about{border-top:1px solid var(--line);padding-top:14px;font-size:.92rem;color:var(--muted)}
.about b{color:var(--ink)}
.about p + p{margin-top:8px}

label.field{display:block;font-weight:600;font-size:.95rem}
select{font:inherit;width:100%;margin-top:6px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

/* ---------- AHP math (tested separately) ---------- */
//MATH-START
function buildMatrix(n, pairs){
  const A = Array.from({length:n},()=>Array(n).fill(1));
  pairs.forEach(p=>{ A[p.i][p.j]=p.v; A[p.j][p.i]=1/p.v; });
  return A;
}
function priorities(A){
  const n=A.length; let w=Array(n).fill(1/n);
  for(let k=0;k<500;k++){
    const x=A.map(r=>r.reduce((s,a,j)=>s+a*w[j],0));
    const sum=x.reduce((a,b)=>a+b,0);
    const nw=x.map(v=>v/sum);
    const d=Math.max(...nw.map((v,i)=>Math.abs(v-w[i])));
    w=nw; if(d<1e-13) break;
  }
  const Aw=A.map(r=>r.reduce((s,a,j)=>s+a*w[j],0));
  const lambda=Aw.reduce((s,v,i)=>s+v/w[i],0)/n;
  return {w,lambda};
}
const RI={1:0,2:0,3:0.58,4:0.90,5:1.12,6:1.24,7:1.32,8:1.41,9:1.45};
function consistency(A){
  const n=A.length; const {w,lambda}=priorities(A);
  const CI=(lambda-n)/(n-1);
  const cr = n>2 ? Math.max(0,CI/RI[n]) : 0;
  return {w,lambda,CI,cr};
}
function worstPair(A,w){
  let best=null;
  for(let i=0;i<A.length;i++) for(let j=i+1;j<A.length;j++){
    const dev=Math.abs(Math.log(A[i][j]/(w[i]/w[j])));
    if(!best||dev>best.dev) best={i,j,dev};
  }
  return best;
}
//MATH-END

/* ---------- Questions ---------- */
const QS=[];
for(let i=0;i<5;i++) for(let j=i+1;j<5;j++) QS.push({level:'top',i,j,a:GROUPS[i],b:GROUPS[j]});
for(let i=0;i<3;i++) for(let j=i+1;j<3;j++) QS.push({level:'infra',i,j,a:INFRA[i],b:INFRA[j]});
const NQ=QS.length; // 13
const LAST={top:QS.map(q=>q.level).lastIndexOf('top'), infra:NQ-1};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Curitiba (first stop) and Foz (final stop) always come first; the other eight are shuffled. */
function mkOrder(){return ['curitiba','foz'].concat(shuffle(DEST.filter(d=>!d.locked).map(d=>d.id)));}
const S={lang:'en',step:'intro',qi:0,consent:false,profile:{type:'',years:'',country:''},ans:{},beauty:{},order:mkOrder(),fromResult:false,msg:'',lb:null,
  tries:{top:0,infra:0}, rev:null, id:newId(), send:{status:'idle',data:null}};
const t=()=>T[S.lang];

/* step s in -4..4 : positive = left (A) matters more */
const stepToValue=s=> s===0?1 : s>0 ? 1+2*s : 1/(1+2*(-s));

/* ---------- Compute ---------- */
function compute(){
  const topPairs=[], infPairs=[];
  QS.forEach((q,k)=>{ const v=stepToValue(S.ans[k]); (q.level==='top'?topPairs:infPairs).push({i:q.i,j:q.j,v,k}); });
  const At=buildMatrix(5,topPairs), Ai=buildMatrix(3,infPairs);
  const ct=consistency(At), ci=consistency(Ai);
  const gi=k=>GROUPS.indexOf(k);
  const g={};
  g.safety=ct.w[gi('safety')]; g.price=ct.w[gi('price')];
  const wInfra=ct.w[gi('infra')];
  g.transport=wInfra*ci.w[0]; g.lodging=wInfra*ci.w[1]; g.food=wInfra*ci.w[2];
  g.activities=ct.w[gi('activities')]; g.beauty=ct.w[gi('beauty')];
  const wt=worstPair(At,ct.w), wi=worstPair(Ai,ci.w);
  const idx=(level,p)=>QS.findIndex(q=>q.level===level&&q.i===p.i&&q.j===p.j);
  return {ct,ci,g,
    worstTop: ct.cr>CR_LIMIT ? {q:idx('top',wt),a:GROUPS[wt.i],b:GROUPS[wt.j]} : null,
    worstInfra: ci.cr>CR_LIMIT ? {q:idx('infra',wi),a:INFRA[wi.i],b:INFRA[wi.j]} : null};
}

/* ---------- Consistency check while answering ---------- */
/* CR of one block of comparisons, the question that fits least, and the answer the other answers point to. */
function blockCheck(level){
  const n=level==='top'?5:3, pairs=[];
  QS.forEach((q,k)=>{ if(q.level===level) pairs.push({i:q.i,j:q.j,v:stepToValue(S.ans[k])}); });
  const A=buildMatrix(n,pairs), c=consistency(A), wp=worstPair(A,c.w);
  const q=QS.findIndex(x=>x.level===level&&x.i===wp.i&&x.j===wp.j);
  const r=c.w[wp.i]/c.w[wp.j];
  const expected = r>=1 ? Math.min(4,Math.round((r-1)/2)) : -Math.min(4,Math.round((1/r-1)/2));
  return {cr:c.cr,q,expected};
}
/* true = the respondent may move on. false = blocked: S.rev is set and the review page is shown. */
function runGate(level){
  const c=blockCheck(level);
  if(c.cr<=CR_LIMIT){S.rev=null;return true;}
  S.tries[level]++;
  if(S.tries[level]>=MAX_TRIES){S.rev=null;return true;}
  S.rev={level,q:c.q,expected:c.expected};
  return false;
}
function afterGate(level){
  S.rev=null;
  if(level==='top'){S.step='q';S.qi=LAST.top+1;} else {S.step='beauty';}
}

/* ---------- Render ---------- */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEPS=[4,3,2,1,0,-1,-2,-3,-4];

function progress(){
  let done=0; const total=NQ+2;
  if(S.step==='profile') done=0.3;
  else if(S.step==='q') done=1+S.qi;
  else if(S.step==='beauty') done=NQ+1;
  else if(S.step==='result'||S.step==='send') done=total;
  document.getElementById('bar').style.width=Math.round(100*done/total)+'%';
}

/* Review page: all answers of the blocked block, with the one that fits least marked. */
function suggestText(q,s){
  const L=t();
  if(s===0) return `${L.verbal[0].toLowerCase()} (1)`;
  const name=L.crit[s>0?q.a:q.b][0];
  return `${name}: ${L.verbal[Math.abs(s)].toLowerCase()} (${1+2*Math.abs(s)})`;
}
function viewReview(){
  const L=t(), rv=S.rev;
  const rows=QS.map((q,k)=>[q,k]).filter(([q])=>q.level===rv.level).map(([q,k])=>{
    const cur=S.ans[k], A=L.crit[q.a][0], B=L.crit[q.b][0], worst=k===rv.q;
    const hint = worst && rv.expected!==cur ? `<p class="rv-h">${esc(L.gateSuggest(suggestText(q,rv.expected)))}</p>` : '';
    return `<div class="rv ${worst?'worst':''}">
      <div class="rv-t"><b>${esc(A)}</b><span>·</span><b>${esc(B)}</b></div>
      <div class="rv-s" role="group" aria-label="${esc(A+' / '+B)}">
        ${STEPS.map(s=>`<button type="button" data-act="rans" data-k="${k}" data-v="${s}" aria-pressed="${cur===s}" aria-label="${s===0?esc(L.equal):esc((s>0?A:B)+' '+(1+2*Math.abs(s)))}">${1+2*Math.abs(s)}</button>`).join('')}
      </div>
      <div class="rv-e"><span>◀ ${esc(A)}</span><span>${esc(L.equal)}</span><span>${esc(B)} ▶</span></div>
      ${hint}

}

function payload(r){
  const w={}; Object.keys(r.g).forEach(k=>w[k]=+r.g[k].toFixed(4));
  return {
    id:S.id, language:S.lang, timestamp:new Date().toISOString(),
    profile:{type:t().types[S.profile.type],years:t().years[S.profile.years],country:t().countries[S.profile.country]},
    judgments:QS.map((q,k)=>({level:q.level,left:q.a,right:q.b,step:S.ans[k],value:+stepToValue(S.ans[k]).toFixed(4)})),
    weights:w, consistency:{top:+r.ct.cr.toFixed(3),infra:+r.ci.cr.toFixed(3),threshold:CR_LIMIT},
    checkTries:{top:S.tries.top,infra:S.tries.infra},
    discard:(r.ct.cr>CR_LIMIT)||(r.ci.cr>CR_LIMIT),
    attractiveness:S.beauty
  };
}
function viewResult(){
  const L=t(), r=compute();
  const crit=['safety','price','transport','lodging','food','activities','beauty'];
  const sorted=crit.slice().sort((a,b)=>r.g[b]-r.g[a]);
  const name=k=>L.crit[k][0];
  const bars=sorted.map(k=>`<div class="bar"><span>${esc(name(k))}</span><span class="track"><i style="width:${(r.g[k]*100/ r.g[sorted[0]]).toFixed(1)}%"></i></span><em>${(r.g[k]*100).toFixed(1)}%</em></div>`).join('');
  const pill=cr=>`<span class="pill ${cr<=CR_LIMIT?'good':'warn'}">${cr<=CR_LIMIT?esc(L.ok):esc(L.bad)} · CR ${cr.toFixed(3)}</span>`;
  const notes=[r.worstTop,r.worstInfra].filter(Boolean).map(w=>`<div class="note stack"><p>${esc(L.revise(name(w.a),name(w.b),w.q+1))}</p><button class="btn ghost" type="button" data-act="revq" data-v="${w.q}">${esc(L.reviseBtn)}</button></div>`).join('');
  const rows=Object.keys(S.beauty).sort((a,b)=>S.beauty[b]-S.beauty[a]).map(id=>`<tr><td>${esc(L.dest[id][0])}</td><td class="n">${S.beauty[id]}</td></tr>`).join('');
  const pl=payload(r);
  const json=JSON.stringify(pl,null,2);
  return `<section class="card stack">
    <h2>${esc(L.resTitle)}</h2>

    <p>${esc(L.discard)}: <b>${esc(pl.discard?L.yes:L.no)}</b></p>
    ${notes}
    <h3>${esc(L.beautyRes)}</h3><table><tbody>${rows}</tbody></table>
    <h3>${esc(L.json)}</h3>

    <div class="row"><button class="btn ghost" type="button" data-act="prev">${esc(L.back)}</button><button class="btn" type="button" data-act="copy" id="copybtn">${esc(L.copy)}</button></div>
    <p id="copymsg" aria-live="polite" style="color:var(--muted);font-size:.88rem"></p>
  </section>`;
}

/* ---------- Sending (published mode) ---------- */
/* The JSON is built once and kept, so a retry sends exactly the same answers with the same id. */
async function sendAnswers(){
  if(!S.send.data) S.send.data=payload(compute());
  S.send.status='sending'; render();
  try{
    /* text/plain keeps this a "simple" request (no CORS preflight), which Apps Script requires. */
    const resp=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(S.send.data),redirect:'follow',referrerPolicy:'no-referrer',credentials:'omit'});
    const out=await resp.json();
    if(!resp.ok||!out||out.ok!==true) throw new Error('rejected');
    S.send.status='sent';
  }catch(_){ S.send.status='failed'; }
  render(); window.scrollTo(0,0);
}
function viewSend(){
  const L=t(), st=S.send.status;
  if(st==='sent') return `<section class="card stack">
    <h1>${esc(L.thanksTitle)}</h1><p class="lead">${esc(L.thanksLead)}</p>
    <div class="about"><p>${esc(L.contact)}</p></div>
  </section>`;
  if(st==='failed') return `<section class="card stack">
    <h2>${esc(L.failTitle)}</h2>
    <p class="note" role="alert">${esc(L.failLead)}</p>
    <div class="row"><span></span><button class="btn" type="button" data-act="retry">${esc(L.retry)}</button></div>
    <p class="lead">${esc(L.failBackup)}</p>
    <textarea id="json" readonly>${esc(JSON.stringify(S.send.data,null,2))}</textarea>
    <div class="row"><span></span><button class="btn ghost" type="button" data-act="copy" id="copybtn">${esc(L.copy)}</button></div>
    <p id="copymsg" aria-live="polite" style="color:var(--muted);font-size:.88rem"></p>
  </section>`;
  return `<section class="card"><p class="lead" aria-live="polite">${esc(L.sending)}</p></section>`;
}

function lbList(id){return DEST.find(d=>d.id===id).photos.map((p,i)=>p?i:-1).filter(i=>i>=0);}
function viewLightbox(){
  const L=t(), d=DEST.find(x=>x.id===S.lb.id), ph=d.photos[S.lb.i], lg=S.lang==='pt'?2:1;
  const list=lbList(S.lb.id), pos=list.indexOf(S.lb.i)+1;
  return `<div class="lb" role="dialog" aria-modal="true" aria-label="${esc(L.dest[d.id][0])}" data-act="lbclose">
    <button class="lb-x" type="button" data-act="lbclose" aria-label="${esc(L.close)}">×</button>
    <button type="button" data-act="lbnav" data-v="-1" aria-label="${esc(L.prevPhoto)}">‹</button>
    <figure data-act="noop"><img src="${IMG+ph[0]}.jpg" alt="${esc(L.dest[d.id][0]+': '+ph[lg])}"><figcaption>${esc(L.dest[d.id][0])} · ${esc(ph[lg])} (${pos}/${list.length})</figcaption></figure>
    <button type="button" data-act="lbnav" data-v="1" aria-label="${esc(L.nextPhoto)}">›</button>
  </div>`;
}
function lbMove(dir){const list=lbList(S.lb.id);const k=(list.indexOf(S.lb.i)+dir+list.length)%list.length;S.lb.i=list[k];}
let lastKey='';
function render(){
  const L=t();
  document.documentElement.lang=S.lang==='pt'?'pt-PT':'en';
  document.title=L.brand;
  document.getElementById('brand').textContent=L.brand;
  ['en','pt'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed',String(S.lang===l)));
  let h='';
  if(S.step==='intro') h=viewIntro();
  else if(S.step==='profile') h=viewProfile();
  else if(S.step==='q') h=S.rev?viewReview():viewQ();
  else if(S.step==='beauty') h=viewBeauty();
  else if(S.step==='send') h=viewSend();
  else if(isTest()) h=viewResult();
  else {S.step='beauty'; h=viewBeauty();}
  if(isTest()) h+=`<footer class="tools"><span>${esc(L.tools)}:</span><button type="button" data-act="fill">${esc(L.fill)}</button><button type="button" data-act="fillrand">${esc(L.fillRand)}</button><button type="button" data-act="restart">${esc(L.restart)}</button><button type="button" data-act="previewthanks">${esc(L.previewThanks)}</button></footer>`;
  if(S.lb) h+=viewLightbox();
  app.className='wrap'+(S.step==='beauty'?' wide':'');
  app.innerHTML=h; progress();
  const key=S.step+':'+S.qi+':'+(S.rev?'r':''); if(key!==lastKey){lastKey=key; if(S.step!=='intro') window.scrollTo(0,0);}
  if(S.lb){const x=document.querySelector('.lb-x'); if(x) x.focus();}
}

/* ---------- Events ---------- */
function resetCheck(){S.tries={top:0,infra:0};S.rev=null;}
function fillExample(){
  const hid={safety:.30,price:.15,infra:.25,activities:.12,beauty:.18}, hin={transport:.30,lodging:.40,food:.30};
  QS.forEach((q,k)=>{
    const wa=(q.level==='top'?hid:hin)[q.a], wb=(q.level==='top'?hid:hin)[q.b];
    const r=Math.max(wa,wb)/Math.min(wa,wb);
    let s=Math.round((r-1)/2 + (Math.random()-.5)*1.4); s=Math.max(0,Math.min(4,s));
    S.ans[k]= wa>=wb ? s : -s;
  });
  DEST.filter(d=>!d.locked).forEach(d=>S.beauty[d.id]=3+Math.floor(Math.random()*7));
  S.profile={type:'0',years:'2',country:'0'}; S.consent=true; S.step='result'; S.fromResult=false; resetCheck();
}
/* Random answers, then jump to the last question of the first block so the check can be tried. */
function fillRandom(){
  QS.forEach((q,k)=>{S.ans[k]=Math.floor(Math.random()*9)-4;});
  S.profile={type:'0',years:'2',country:'0'}; S.consent=true; S.step='q'; S.qi=LAST.top; S.fromResult=false; resetCheck();
}
app.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='consent'){S.consent=el.checked; render(); document.getElementById('consent')?.focus();}
  if(el.dataset.act==='prof'){S.profile[el.dataset.k]=el.value; const id=el.id; render(); document.getElementById(id)?.focus();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='SELECT'||b.type==='checkbox') return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='noop') return;
  if(a==='lang'){S.lang=v;}
  else if(a==='start'){S.step='profile';}
  else if(a==='goto'){ if(v==='q0'){S.step='q';S.qi=0;} else S.step=v; }
  else if(a==='ans'){S.ans[S.qi]=parseInt(v,10);}
  else if(a==='rans'){S.ans[parseInt(b.dataset.k,10)]=parseInt(v,10);}
  else if(a==='next'){
    const level = S.qi===LAST.top?'top' : S.qi===LAST.infra?'infra' : null;
    if(level){ if(runGate(level)) afterGate(level); }
    else S.qi++;
  }
  else if(a==='recheck'){ const level=S.rev.level; if(runGate(level)) afterGate(level); }
  else if(a==='prev'){
    if(S.rev){ S.qi=LAST[S.rev.level]; S.rev=null; }
    else if(S.step==='q'){ if(S.fromResult){S.fromResult=false;S.step='result';} else if(S.qi>0) S.qi--; else S.step='profile'; }
    else if(S.step==='beauty'){S.step='q';S.qi=NQ-1;}
    else if(S.step==='result'){S.step='beauty';}
  }
  else if(a==='open'){S.lb={id:b.dataset.id,i:parseInt(v,10)};}
  else if(a==='lbclose'){S.lb=null;}
  else if(a==='lbnav'){lbMove(parseInt(v,10));}
  else if(a==='rate'){ if(DEST.find(x=>x.id===b.dataset.id).locked) return; S.beauty[b.dataset.id]=parseInt(v,10);}
  else if(a==='toresult'){S.step='result';S.fromResult=false;}
  else if(a==='revq'){S.step='q';S.qi=parseInt(v,10);S.fromResult=true;}
  else if(a==='fill'){fillExample();}
  else if(a==='fillrand'){fillRandom();}
  else if(a==='restart'){Object.assign(S,{step:'intro',qi:0,consent:false,profile:{type:'',years:'',country:''},ans:{},beauty:{},order:mkOrder(),fromResult:false,id:newId(),send:{status:'idle',data:null}}); resetCheck();}
  else if(a==='submit'){ if(DEST.some(d=>!d.locked&&!S.beauty[d.id])) return; S.step='send'; sendAnswers(); return; }
  else if(a==='retry'){ sendAnswers(); return; }
  else if(a==='previewthanks'){ S.step='send'; S.send={status:'sent',data:null}; }  /* #test only: shows the thank-you screen and sends nothing */
  else if(a==='copy'){
    const ta=document.getElementById('json'), msg=document.getElementById('copymsg');
    const fail=()=>{ta.focus();ta.select();msg.textContent=t().copyFail;};
    try{ navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent=t().copied;}).catch(fail); }catch(_){fail();}
    return;
  }
  const y=window.scrollY;
  render();
  window.scrollTo(0,y);
  if(a==='goto'||a==='next'||a==='prev'||a==='start'||a==='toresult'||a==='revq'||a==='fill'||a==='fillrand'||a==='restart'||a==='recheck') window.scrollTo(0,0);
});
document.addEventListener('keydown',e=>{
  if(!S.lb) return;
  if(e.key==='Escape') S.lb=null; else if(e.key==='ArrowRight') lbMove(1); else if(e.key==='ArrowLeft') lbMove(-1); else return;
  const y=window.scrollY; render(); window.scrollTo(0,y);
});
window.addEventListener('hashchange',()=>render());
render();
</script>
</body>
